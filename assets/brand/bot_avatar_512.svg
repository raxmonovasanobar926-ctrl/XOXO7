<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="70%" stopColor="#040814" />
      <stop offset="100%" stopColor="#010307" />
    </radialGradient>
    <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#A5F3FC" />
      <stop offset="50%" stopColor="#00F0FF" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <linearGradient id="neonRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FECDD3" />
      <stop offset="50%" stopColor="#FF2D55" />
      <stop offset="100%" stopColor="#BE123C" />
    </linearGradient>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  {/* Background */}
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  {/* Subtle Cyber Grid */}
  <path d="M64 0V512 M128 0V512 M192 0V512 M256 0V512 M320 0V512 M384 0V512 M448 0V512" stroke="#1E293B" strokeWidth="1" strokeOpacity="0.4" />
  <path d="M0 64H512 M0 128H512 M0 192H512 M0 256H512 M0 320H512 M0 384H512 M0 448H512" stroke="#1E293B" strokeWidth="1" strokeOpacity="0.4" />

  {/* Outer Neon Border */}
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#38BDF8" strokeWidth="3" strokeOpacity="0.4" />

  {/* Neon 'X' on Left */}
  <g filter="url(#glowBlue)">
    <line x1="120" y1="140" x2="240" y2="360" stroke="url(#neonBlue)" strokeWidth="36" strokeLinecap="round" />
    <line x1="240" y1="140" x2="120" y2="360" stroke="url(#neonBlue)" strokeWidth="36" strokeLinecap="round" />
    <line x1="120" y1="140" x2="240" y2="360" stroke="#FFFFFF" strokeWidth="12" strokeLinecap="round" />
    <line x1="240" y1="140" x2="120" y2="360" stroke="#FFFFFF" strokeWidth="12" strokeLinecap="round" />
  </g>

  {/* Neon 'O' on Right */}
  <g filter="url(#glowRed)">
    <circle cx="340" cy="250" r="90" stroke="url(#neonRed)" strokeWidth="36" />
    <circle cx="340" cy="250" r="90" stroke="#FFFFFF" strokeWidth="12" />
  </g>

  {/* Center VS Arcade Badge */}
  <rect x="216" y="226" width="80" height="48" rx="14" fill="#0F172A" stroke="#F59E0B" strokeWidth="4" />
  <text x="256" y="258" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="2">VS</text>

  {/* Title at Bottom */}
  <text x="256" y="440" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="8">XOXO</text>
</svg>
