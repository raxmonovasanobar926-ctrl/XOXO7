<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bannerBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="80%" stopColor="#030712" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#67E8F9" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <linearGradient id="neonRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FDA4AF" />
      <stop offset="100%" stopColor="#E11D48" />
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bannerBg)" />

  {/* Diagonal Grid Lines */}
  <path d="M-100 0 L400 360 M100 0 L600 360 M300 0 L800 360" stroke="#1E293B" strokeWidth="1.5" strokeOpacity="0.3" />
  <path d="M740 0 L240 360 M540 0 L40 360" stroke="#1E293B" strokeWidth="1.5" strokeOpacity="0.3" />

  {/* Left Blue Glow / Right Red Glow */}
  <circle cx="100" cy="180" r="160" fill="#00F0FF" fillOpacity="0.12" />
  <circle cx="540" cy="180" r="160" fill="#FF2D55" fillOpacity="0.12" />

  {/* X Symbol Left */}
  <line x1="80" y1="110" x2="180" y2="230" stroke="url(#neonCyan)" strokeWidth="24" strokeLinecap="round" />
  <line x1="180" y1="110" x2="80" y2="230" stroke="url(#neonCyan)" strokeWidth="24" strokeLinecap="round" />
  <line x1="80" y1="110" x2="180" y2="230" stroke="#FFFFFF" strokeWidth="8" strokeLinecap="round" />
  <line x1="180" y1="110" x2="80" y2="230" stroke="#FFFFFF" strokeWidth="8" strokeLinecap="round" />

  {/* O Symbol Right */}
  <circle cx="510" cy="170" r="60" stroke="url(#neonRose)" strokeWidth="24" />
  <circle cx="510" cy="170" r="60" stroke="#FFFFFF" strokeWidth="8" />

  {/* Center VS & Text */}
  <rect x="270" y="70" width="100" height="54" rx="16" fill="#0F172A" stroke="#F59E0B" strokeWidth="3" />
  <text x="320" y="106" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="28" font-weight="900">VS</text>

  <text x="320" y="190" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="6">XOXO</text>
  <text x="320" y="226" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2">NEON ARCADE TACTICAL BATTLE</text>
  
  <rect x="220" y="260" width="200" height="38" rx="19" fill="#0284C7" fillOpacity="0.2" stroke="#38BDF8" strokeWidth="1.5" />
  <text x="320" y="284" text-anchor="middle" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="800">PLAY • EARN STONES • WIN</text>
