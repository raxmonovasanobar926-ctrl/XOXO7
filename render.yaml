services:
  - type: web
    name: xoxo
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_TELEGRAM_ID
        sync: false
      - key: INITIAL_TOKENS
        value: "25"
      - key: REFERRAL_BONUS
        value: "5"
