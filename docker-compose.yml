version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: xoxo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xoxo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xoxo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-xoxo_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xoxo_user} -d ${POSTGRES_DB:-xoxo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xoxo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xoxo_backend
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-xoxo-super-secret-jwt-key-32chars}
      DATABASE_URL: postgres://${POSTGRES_USER:-xoxo_user}:${POSTGRES_PASSWORD:-xoxo_secret}@postgres:5432/${POSTGRES_DB:-xoxo_db}
      REDIS_URL: redis://redis:6379
      INITIAL_TOKENS: 25
      REFERRAL_BONUS: 5
      DAILY_BONUS: 5
      RPS_TIMEOUT_SECONDS: 5
      TURN_TIMEOUT_SECONDS: 20
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: xoxo_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
